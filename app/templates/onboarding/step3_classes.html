{% extends "base.html" %}

{% block title %}Onboarding - Create Classes{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Progress bar -->
    <div class="px-4 pt-4">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-semibold text-gold-600">Step 3 of 5</span>
            <span class="text-sm text-navy-500">Create Classes</span>
        </div>
        <div class="cu-progress">
            <div class="cu-progress-fill cu-progress-fill--navy" style="width: 60%"></div>
        </div>
    </div>

    <div class="cu-card p-6 sm:p-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-navy-900">Create Your Classes</h1>
            <p class="mt-2 text-navy-600">Add the classes or groups you'll be managing. You can add more later.</p>
        </div>

        <form method="POST" action="/onboarding/step3" class="space-y-5" id="classForm">
            <div id="classesContainer" class="space-y-4">
                <!-- Class 1 (always shown) -->
                <div class="class-entry rounded-2xl ring-1 ring-navy-100 p-4" data-index="1">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-navy-700">Class 1</h3>
                    </div>
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div class="sm:col-span-2">
                            <label class="block text-sm font-medium text-navy-700 mb-1">Class Name <span class="text-red-500">*</span></label>
                            <input type="text" name="class_name_1" required class="cu-input"
                                   placeholder="e.g., Butterfly Room, Grade 1A">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-navy-700 mb-1">Grade Level</label>
                            <select name="class_grade_level_id_1" class="grade-level-select cu-select">
                                <option value="">Select grade level...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-navy-700 mb-1">Capacity</label>
                            <input type="number" name="class_capacity_1" min="1" class="cu-input"
                                   placeholder="Max students">
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="addClassBtn"
                    class="w-full flex items-center justify-center px-4 py-3 border-2 border-dashed border-navy-200 rounded-2xl text-sm font-semibold text-navy-600 hover:border-navy-500 hover:text-navy-700 hover:bg-navy-50 transition-colors">
                <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add Another Class
            </button>

            <div class="flex items-center justify-between pt-4">
                <a href="/onboarding/step2" class="cu-btn-soft">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Back
                </a>
                <button type="submit" class="cu-btn-primary !px-6 !py-3">
                    Continue
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
let classCount = 1;
let gradeLevelOptions = '';

async function loadGradeLevels() {
    try {
        const response = await fetch('/api/v1/grade-levels', { credentials: 'same-origin' });
        const result = await response.json();
        if (response.ok && result.data) {
            gradeLevelOptions = result.data.map(gl =>
                `<option value="${gl.id}">${gl.name}</option>`
            ).join('');
            document.querySelectorAll('.grade-level-select').forEach(select => {
                select.innerHTML = '<option value="">Select grade level...</option>' + gradeLevelOptions;
            });
        }
    } catch (error) {
        console.error('Failed to load grade levels:', error);
    }
}

loadGradeLevels();

document.getElementById('addClassBtn').addEventListener('click', function() {
    classCount++;
    const container = document.getElementById('classesContainer');

    const classEntry = document.createElement('div');
    classEntry.className = 'class-entry rounded-2xl ring-1 ring-navy-100 p-4';
    classEntry.dataset.index = classCount;

    classEntry.innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-medium text-navy-700">Class ${classCount}</h3>
            <button type="button" class="remove-class text-red-500 hover:text-red-700 text-sm">
                Remove
            </button>
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-navy-700 mb-1">Class Name <span class="text-red-500">*</span></label>
                <input type="text" name="class_name_${classCount}" required class="cu-input"
                       placeholder="e.g., Butterfly Room, Grade 1A">
            </div>
            <div>
                <label class="block text-sm font-medium text-navy-700 mb-1">Grade Level</label>
                <select name="class_grade_level_id_${classCount}" class="grade-level-select cu-select">
                    <option value="">Select grade level...</option>
                    ${gradeLevelOptions}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-navy-700 mb-1">Capacity</label>
                <input type="number" name="class_capacity_${classCount}" min="1" class="cu-input"
                       placeholder="Max students">
            </div>
        </div>
    `;

    container.appendChild(classEntry);

    classEntry.querySelector('.remove-class').addEventListener('click', function() {
        classEntry.remove();
    });
});
</script>
{% endblock %}
