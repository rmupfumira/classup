{% extends "base.html" %}

{% block title %}Onboarding - Invite Teachers{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Progress bar -->
    <div class="px-4 pt-4">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-semibold text-gold-600">Step 4 of 5</span>
            <span class="text-sm text-navy-500">Invite Teachers</span>
        </div>
        <div class="cu-progress">
            <div class="cu-progress-fill cu-progress-fill--navy" style="width: 80%"></div>
        </div>
    </div>

    <div class="cu-card p-6 sm:p-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-navy-900">Invite Your Teachers</h1>
            <p class="mt-2 text-navy-600">Add teacher email addresses. They'll receive an invitation to join.</p>
        </div>

        <form method="POST" action="/onboarding/step4" class="space-y-5" id="teacherForm">
            <div id="teachersContainer" class="space-y-4">
                <!-- Teacher 1 -->
                <div class="teacher-entry rounded-2xl ring-1 ring-navy-100 p-4" data-index="1">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-navy-700">Teacher 1</h3>
                    </div>
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                        <div>
                            <label class="block text-sm font-medium text-navy-700 mb-1">First Name</label>
                            <input type="text" name="teacher_first_name_1" class="cu-input" placeholder="Jane">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-navy-700 mb-1">Last Name</label>
                            <input type="text" name="teacher_last_name_1" class="cu-input" placeholder="Smith">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-navy-700 mb-1">Email <span class="text-red-500">*</span></label>
                            <input type="email" name="teacher_email_1" class="cu-input" placeholder="jane@school.com">
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="addTeacherBtn"
                    class="w-full flex items-center justify-center px-4 py-3 border-2 border-dashed border-navy-200 rounded-2xl text-sm font-semibold text-navy-600 hover:border-navy-500 hover:text-navy-700 hover:bg-navy-50 transition-colors">
                <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add Another Teacher
            </button>

            <div class="flex items-center justify-between pt-4">
                <a href="/onboarding/step3" class="cu-btn-soft">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Back
                </a>
                <div class="flex items-center gap-4">
                    <a href="/onboarding/step5" class="text-sm text-navy-500 hover:text-navy-700">
                        Skip for now
                    </a>
                    <button type="submit" class="cu-btn-primary !px-6 !py-3">
                        Continue
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
let teacherCount = 1;

document.getElementById('addTeacherBtn').addEventListener('click', function() {
    teacherCount++;
    const container = document.getElementById('teachersContainer');

    const teacherEntry = document.createElement('div');
    teacherEntry.className = 'teacher-entry rounded-2xl ring-1 ring-navy-100 p-4';
    teacherEntry.dataset.index = teacherCount;

    teacherEntry.innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-medium text-navy-700">Teacher ${teacherCount}</h3>
            <button type="button" class="remove-teacher text-red-500 hover:text-red-700 text-sm">
                Remove
            </button>
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div>
                <label class="block text-sm font-medium text-navy-700 mb-1">First Name</label>
                <input type="text" name="teacher_first_name_${teacherCount}" class="cu-input" placeholder="Jane">
            </div>
            <div>
                <label class="block text-sm font-medium text-navy-700 mb-1">Last Name</label>
                <input type="text" name="teacher_last_name_${teacherCount}" class="cu-input" placeholder="Smith">
            </div>
            <div>
                <label class="block text-sm font-medium text-navy-700 mb-1">Email <span class="text-red-500">*</span></label>
                <input type="email" name="teacher_email_${teacherCount}" class="cu-input" placeholder="jane@school.com">
            </div>
        </div>
    `;

    container.appendChild(teacherEntry);

    teacherEntry.querySelector('.remove-teacher').addEventListener('click', function() {
        teacherEntry.remove();
    });
});
</script>
{% endblock %}
