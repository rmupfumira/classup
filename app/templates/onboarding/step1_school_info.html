{% extends "base.html" %}

{% block title %}Onboarding - School Information{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Progress bar -->
    <div class="px-4 pt-4">
        <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-semibold text-gold-600">Step 1 of 5</span>
            <span class="text-sm text-navy-500">School Information</span>
        </div>
        <div class="cu-progress">
            <div class="cu-progress-fill cu-progress-fill--navy" style="width: 20%"></div>
        </div>
    </div>

    <div class="cu-card p-6 sm:p-10">
        <div class="text-center mb-8">
            <span class="cu-eyebrow mb-3">Welcome</span>
            <h1 class="text-2xl font-bold text-navy-900 mt-3">Welcome to {{ app_name }}!</h1>
            <p class="mt-2 text-navy-600">Let's set up your school. This will only take a few minutes.</p>
        </div>

        <form method="POST" action="/onboarding/step1" class="space-y-5">
            <div>
                <label for="name" class="block text-sm font-medium text-navy-700 mb-1">
                    School Name <span class="text-red-500">*</span>
                </label>
                <input type="text" name="name" id="name" required
                       value="{{ status.tenant_name }}"
                       class="cu-input">
            </div>

            <div>
                <label for="address" class="block text-sm font-medium text-navy-700 mb-1">
                    Address
                </label>
                <textarea name="address" id="address" rows="3"
                          class="cu-textarea"
                          placeholder="123 Main Street, City, Country"></textarea>
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-navy-700 mb-1">
                    Phone Number
                </label>
                <input type="tel" name="phone" id="phone"
                       class="cu-input"
                       placeholder="+27 12 345 6789">
            </div>

            <div>
                <label for="timezone" class="block text-sm font-medium text-navy-700 mb-1">
                    Timezone
                </label>
                <select name="timezone" id="timezone" class="cu-select">
                    <option value="Africa/Johannesburg" selected>Africa/Johannesburg (SAST)</option>
                    <option value="Africa/Cairo">Africa/Cairo (EET)</option>
                    <option value="Africa/Lagos">Africa/Lagos (WAT)</option>
                    <option value="Europe/London">Europe/London (GMT)</option>
                    <option value="America/New_York">America/New York (EST)</option>
                    <option value="America/Los_Angeles">America/Los Angeles (PST)</option>
                    <option value="Asia/Dubai">Asia/Dubai (GST)</option>
                    <option value="Australia/Sydney">Australia/Sydney (AEST)</option>
                </select>
            </div>

            <div class="flex items-center justify-between pt-4">
                <a href="/onboarding/skip" class="text-sm text-navy-500 hover:text-navy-700">
                    Skip for now
                </a>
                <button type="submit" class="cu-btn-primary !px-6 !py-3">
                    Continue
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
