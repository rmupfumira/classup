{% extends "base.html" %}

{% block title %}Page Not Found - {{ app_name }}{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 cu-app-bg">
    <div class="cu-card max-w-md w-full p-10 text-center">
        <div class="cu-avatar cu-avatar-lg mx-auto mb-5">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                      d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/>
            </svg>
        </div>
        <span class="cu-eyebrow mb-2">Error 404</span>
        <h1 class="cu-page-title mt-2">Page not found</h1>
        <p class="mt-3 text-sm text-navy-500 leading-relaxed">
            Sorry, we couldn't find the page you're looking for. It may have moved or no longer exist.
        </p>
        <div class="mt-6">
            <a href="/" class="cu-btn-primary">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Go back home
            </a>
        </div>
    </div>
</div>
{% endblock %}
