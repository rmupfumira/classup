{% extends "base.html" %}

{% block title %}Unauthorized - {{ app_name }}{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 cu-app-bg">
    <div class="cu-card max-w-md w-full p-10 text-center">
        <div class="cu-avatar cu-avatar-lg mx-auto mb-5">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
                      d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
            </svg>
        </div>
        <span class="cu-eyebrow mb-2">Error 401</span>
        <h1 class="cu-page-title mt-2">Unauthorised</h1>
        <p class="mt-3 text-sm text-navy-500 leading-relaxed">
            {{ message | default('Please log in to continue.') }}
        </p>
        <div class="mt-6">
            <a href="/login" class="cu-btn-primary">
                Log in
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </a>
        </div>
    </div>
</div>
{% endblock %}
