{% extends "base.html" %}

{% block title %}Chart of Accounts - {{ app_name }}{% endblock %}

{% block content %}
<div class="space-y-5">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-semibold text-neutral-800">Chart of Accounts</h1>
            <p class="mt-0.5 text-sm text-neutral-500">Income and expense categories used to classify every transaction.</p>
        </div>
        <button onclick="openAccount()" class="inline-flex items-center px-3 py-1.5 bg-primary-500 text-white text-sm rounded hover:bg-primary-600">
            + Add account
        </button>
    </div>

    {% include 'accounting/_layout.html' %}

    <div id="groups" class="space-y-4">
        <p class="text-center text-neutral-400 py-8">Loading...</p>
    </div>
</div>

<dialog id="acct-modal" class="rounded-xl border border-neutral-200 shadow-xl p-0 w-full max-w-md backdrop:bg-black/50">
    <form class="p-6" onsubmit="submitAccount(event)">
        <h3 class="text-lg font-semibold text-neutral-800 mb-4" id="acct-title">Add account</h3>
        <input type="hidden" id="a-id">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-medium text-neutral-700 mb-1">Code</label>
                <input type="text" id="a-code" required maxlength="20" placeholder="e.g. 5120"
                       class="block w-full h-9 px-3 text-sm border border-neutral-300 rounded">
            </div>
            <div>
                <label class="block text-xs font-medium text-neutral-700 mb-1">Type</label>
                <select id="a-type" required class="block w-full h-9 px-3 text-sm border border-neutral-300 rounded">
                    <option value="INCOME">Income</option>
                    <option value="EXPENSE">Expense</option>
                    <option value="ASSET">Asset</option>
                    <option value="LIABILITY">Liability</option>
                </select>
            </div>
            <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-neutral-700 mb-1">Name</label>
                <input type="text" id="a-name" required maxlength="120"
                       class="block w-full h-9 px-3 text-sm border border-neutral-300 rounded">
            </div>
            <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-neutral-700 mb-1">Description (optional)</label>
                <textarea id="a-desc" rows="2" class="block w-full px-3 py-2 text-sm border border-neutral-300 rounded"></textarea>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
            <button type="button" onclick="document.getElementById('acct-modal').close()"
                    class="px-4 py-2 text-sm text-neutral-700 bg-neutral-100 rounded hover:bg-neutral-200">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm text-white bg-primary-500 rounded hover:bg-primary-600">Save</button>
        </div>
    </form>
</dialog>

<script>
const TYPE_META = {
    INCOME: { label: 'Income', colour: 'text-success-700', bg: 'bg-success-50' },
    EXPENSE: { label: 'Expense', colour: 'text-warning-700', bg: 'bg-warning-50' },
    ASSET: { label: 'Asset', colour: 'text-primary-700', bg: 'bg-primary-50' },
    LIABILITY: { label: 'Liability', colour: 'text-danger-700', bg: 'bg-danger-50' },
};

async function load() {
    const res = await ClassUp.fetch('/api/v1/accounting/accounts?active_only=false');
    const items = res.data || [];
    const groups = {};
    for (const a of items) {
        if (!groups[a.type]) groups[a.type] = [];
        groups[a.type].push(a);
    }
    const wrap = document.getElementById('groups');
    wrap.innerHTML = '';
    for (const type of ['INCOME', 'EXPENSE', 'ASSET', 'LIABILITY']) {
        const arr = groups[type] || [];
        if (!arr.length) continue;
        const meta = TYPE_META[type];
        const html = `
            <div class="bg-white rounded-lg shadow-card border border-neutral-200 overflow-hidden">
                <div class="px-4 py-2 border-b border-neutral-100 flex items-center justify-between ${meta.bg}">
                    <h2 class="text-sm font-semibold ${meta.colour}">${meta.label}</h2>
                    <span class="text-xs text-neutral-500">${arr.length} account${arr.length === 1 ? '' : 's'}</span>
                </div>
                <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <tbody class="divide-y divide-neutral-100">
                        ${arr.map(a => `
                            <tr class="${a.is_active ? '' : 'opacity-50'}">
                                <td class="px-3 py-2 whitespace-nowrap font-mono text-neutral-500 w-20">${a.code}</td>
                                <td class="px-3 py-2 font-medium text-neutral-800">
                                    ${a.name}
                                    ${a.is_system ? '<span class="text-[10px] inline-flex items-center px-1.5 py-0.5 rounded bg-neutral-100 text-neutral-600 ml-1">System</span>' : ''}
                                    ${!a.is_active ? '<span class="text-[10px] inline-flex items-center px-1.5 py-0.5 rounded bg-neutral-200 text-neutral-700 ml-1">Inactive</span>' : ''}
                                </td>
                                <td class="px-3 py-2 text-neutral-500 text-xs">${a.description || ''}</td>
                                <td class="px-3 py-2 text-right whitespace-nowrap">
                                    <button onclick='openAccount(${JSON.stringify(a).replace(/'/g, "&#39;")})' class="text-xs text-primary-600 hover:underline mr-2">Edit</button>
                                    ${!a.is_system ? (a.is_active ? `<button onclick="toggleAccount('${a.id}', false)" class="text-xs text-neutral-600 hover:underline">Deactivate</button>` : `<button onclick="toggleAccount('${a.id}', true)" class="text-xs text-success-600 hover:underline">Activate</button>`) : '<span class="text-xs text-neutral-400">—</span>'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                </div>
            </div>
        `;
        wrap.insertAdjacentHTML('beforeend', html);
    }
}

function openAccount(a) {
    const isEdit = a && a.id;
    document.getElementById('acct-title').textContent = isEdit ? 'Edit account' : 'Add account';
    document.getElementById('a-id').value = isEdit ? a.id : '';
    document.getElementById('a-code').value = isEdit ? a.code : '';
    document.getElementById('a-code').disabled = !!isEdit;
    document.getElementById('a-type').value = isEdit ? a.type : 'EXPENSE';
    document.getElementById('a-type').disabled = !!isEdit;
    document.getElementById('a-name').value = isEdit ? a.name : '';
    document.getElementById('a-desc').value = isEdit ? (a.description || '') : '';
    document.getElementById('acct-modal').showModal();
}

async function submitAccount(e) {
    e.preventDefault();
    const id = document.getElementById('a-id').value;
    if (id) {
        const body = {
            name: document.getElementById('a-name').value,
            description: document.getElementById('a-desc').value || null,
        };
        try {
            await ClassUp.fetch('/api/v1/accounting/accounts/' + id, { method: 'PUT', body: JSON.stringify(body) });
            document.getElementById('acct-modal').close();
            ClassUp.toast('Updated', 'success');
            load();
        } catch (err) {
            ClassUp.toast(err.message || 'Save failed', 'error');
        }
    } else {
        const body = {
            code: document.getElementById('a-code').value,
            name: document.getElementById('a-name').value,
            type: document.getElementById('a-type').value,
            description: document.getElementById('a-desc').value || null,
        };
        try {
            await ClassUp.fetch('/api/v1/accounting/accounts', { method: 'POST', body: JSON.stringify(body) });
            document.getElementById('acct-modal').close();
            ClassUp.toast('Added', 'success');
            load();
        } catch (err) {
            ClassUp.toast(err.message || 'Save failed', 'error');
        }
    }
}

async function toggleAccount(id, active) {
    try {
        await ClassUp.fetch('/api/v1/accounting/accounts/' + id, { method: 'PUT', body: JSON.stringify({ is_active: active }) });
        ClassUp.toast(active ? 'Activated' : 'Deactivated', 'success');
        load();
    } catch (err) {
        ClassUp.toast(err.message || 'Failed', 'error');
    }
}

load();
</script>
{% endblock %}
